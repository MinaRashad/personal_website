<body class="maze-page">

<!-- Background: one canvas for every star, plus a soft nebula that takes the sector's colour -->
<canvas id="space" aria-hidden="true"></canvas>
<div class="nebula" id="nebula" aria-hidden="true"></div>
<div class="crt" aria-hidden="true"></div>

<!-- The world: current sector in the middle, its neighbours as distant silhouettes -->
<main id="stage" aria-label="Interactive space maze. Use WASD or the arrow keys to travel between sectors and Enter to open one.">
  <div id="parallax">
    <div id="world"></div>
    <div id="labels"></div>
  </div>
</main>

<div id="hud">
  <header id="hud-top">
    <div id="site-title">// explorer_v2.0</div>
    <div id="loc-line">LOCATION: <span id="loc-name">...</span></div>
    <div id="hint">
      <span class="kb-only"><b>WASD</b> move · <b>ENTER</b> access · <b>`</b> terminal · <b>M</b> sound · <b>R</b> home</span>
      <span class="touch-only"><b>SWIPE</b> to travel · <b>TAP</b> a sector · <b>TAP</b> the centre to enter</span>
    </div>
  </header>

  <aside id="map" aria-label="Sector map">
    <div class="map-head"><span>SECTOR MAP</span><span id="map-count">CHARTED 0/0</span></div>
    <canvas id="minimap" width="172" height="132" title="Click a charted sector to warp there"></canvas>
  </aside>

  <section id="panel">
    <div class="panel-head">
      <div id="info-name"></div>
      <div id="info-coord"></div>
    </div>
    <div id="info-desc"></div>
    <button id="info-enter" class="btn" type="button">[ ENTER ] ACCESS</button>
  </section>

  <div id="toolbar">
    <button id="btn-sound" class="btn" type="button" aria-pressed="true">[M] SOUND: ON</button>
    <button id="btn-term" class="btn" type="button">[`] TERMINAL</button>
  </div>
</div>

<div id="term" role="dialog" aria-label="Terminal" aria-hidden="true">
  <div id="term-log"></div>
  <div id="term-row">
    <span id="term-prompt">visitor@maze:~$</span>
    <input id="term-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal command">
  </div>
</div>

<div id="dock" aria-hidden="true"><div id="dock-line"></div></div>
<div id="flash" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>

<noscript>
  <p style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#b0b0d0;padding:24px;text-align:center;">
    This sector needs JavaScript. <a href="About/index.html" style="color:#7a6aee;margin-left:8px;">Go to the About page</a>
  </p>
</noscript>

<audio id="transition_sfx" src="sfx/fast_swoosh.wav" preload="auto"></audio>

<script src="maze.js"></script>
</body>
</html>
