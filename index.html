<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mina Eskandar | Space Maze</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="mobile-blocker">
  <div class="blocker-content">
    <div class="blocker-title">ACCESS_DENIED</div>
    <p>This sector of the universe requires a high-resolution desktop terminal to navigate.</p>
    <p style="margin-top: 15px; font-size: 10px; color: var(--text-dim);">MOBILE_OS_INCOMPATIBLE // RESOLUTION_INSUFFICIENT</p>
  </div>
</div>

<div id="starfield"></div>
<canvas id="warp-canvas"></canvas>

<div id="maze-container">
  <div id="maze-stage">
    <div id="room-view">
      <!-- Room content injected here -->
    </div>
    <div id="node-info">
      <div class="info-name"></div>
      <div class="info-desc"></div>
    </div>
    <!-- Corridors and Signs injected here -->
  </div>
</div>

<div id="ui">
  <div id="header">
    <span id="site-title">// explorer_v1.1</span>
    <span id="hint">WASD to move · ENTER to access  · R to reset</span>
  </div>
  <div id="status">
    <div class="stat">LOCATION: <span id="loc-name">...</span></div>
  </div>
</div>

<audio id="transition_sfx" src="sfx/fast_swoosh.wav" preload="auto"></audio>

<script src="maze.js"></script>
</body>
</html>
