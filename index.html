<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mina Eskandar | Space Maze</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="starfield"></div>
<canvas id="warp-canvas"></canvas>

<div id="maze-container">
  <div id="maze-stage">
    <div id="room-view">
      <!-- Room content injected here -->
    </div>
    <div id="node-info">
      <div class="info-name"></div>
      <div class="info-desc"></div>
    </div>
    <!-- Corridors and Signs injected here -->
  </div>
</div>

<div id="ui">
  <div id="header">
    <span id="site-title">// explorer_v1.1</span>
    <span id="hint">WASD to move · ENTER to access</span>
  </div>
  <div id="status">
    <div class="stat">LOCATION: <span id="loc-name">...</span></div>
  </div>
</div>

<script src="maze.js"></script>
</body>
</html>
