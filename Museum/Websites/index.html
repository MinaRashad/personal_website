<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum - Websites - Mina Eskandar</title>
    <link rel="stylesheet" href="../../fonts.css">
    <link rel="stylesheet" href="../../theme.css">
    <style>
        body {
            background: #000;
            color: var(--text);
            font-family: Pixel, Courier, monospace;
            min-height: 100vh;
            margin: 0;
            padding: 80px 20px;
        }

        .back-to-museum {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(122, 106, 234, 0.2);
        }

        .back-to-museum:hover {
            background: var(--accent);
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(122, 106, 234, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3rem;
            color: var(--text-hi);
            text-shadow: 0 0 20px var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .content-area {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(15, 15, 30, 0.8);
            border: 1px solid var(--border);
            padding: 40px;
            min-height: 400px;
        }

        .website-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .website-card {
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.5);
        }

        .website-card:hover {
            border-color: var(--accent);
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0px rgba(122, 106, 234, 0.35);
        }

        .website-title {
            color: var(--text-hi);
            font-size: 1.15rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .website-url {
            color: var(--accent);
            font-size: 0.8rem;
            word-break: break-all;
            margin-bottom: 14px;
        }

        .website-desc {
            color: var(--text);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .website-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px dashed var(--border);
            padding-top: 12px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .website-tag {
            background: rgba(122, 106, 234, 0.15);
            color: var(--accent);
            border: 1px solid rgba(122, 106, 234, 0.3);
            padding: 3px 8px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div id="starfield"></div>
    <a href="../index.html" class="back-to-museum">&lt; BACK TO MUSEUM</a>

    <header>
        <h1>Websites</h1>
        <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 10px;">
            Nodes of interest in the global network.
        </p>
    </header>

    <div class="content-area">
        <div class="website-grid">
            <a href="https://www.noel-friedrich.de/terminal/" target="_blank" rel="noopener noreferrer" class="website-card">
                <div>
                    <div class="website-title">
                        <span>Terminal Homepage</span>
                        <span style="font-size: 0.85rem; color: var(--accent);">↗</span>
                    </div>
                    <div class="website-url">https://www.noel-friedrich.de/terminal/</div>
                    <div class="website-desc">Personal interactive terminal homepage of Noel Friedrich.</div>
                </div>
                <div class="website-meta">
                    <span class="website-tag">Terminal</span>
                    <span>VISIT &gt;</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        function createStars() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = 0.2 + Math.random() * 0.8;
                starfield.appendChild(star);
            }
        }
        createStars();
    </script>
</body>
</html>
