<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life in Motion - Portfolio</title>
    <meta name="description" content="My life as a flight through space: one planet per chapter, from Alexandria to Berlin.">
    <link rel="stylesheet" href="../fonts.css">

    <!-- three.js is vendored in ./vendor so the page never depends on a CDN -->
    <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #ffd700;
            --bg: #02020a;
            --gold: #ffd700;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            background: var(--bg);
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        /* ---------- 3D canvas + fallback backdrop ---------- */
        #gl {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
        }

        /* Shown only when WebGL is unavailable: a still starfield */
        .backdrop {
            position: fixed;
            inset: 0;
            z-index: -1;
            display: none;
            background:
                radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
                radial-gradient(1px 1px at 78% 12%, #fff 50%, transparent 51%),
                radial-gradient(2px 2px at 44% 36%, #cfd6ff 50%, transparent 51%),
                radial-gradient(1px 1px at 90% 58%, #fff 50%, transparent 51%),
                radial-gradient(1px 1px at 26% 72%, #fff 50%, transparent 51%),
                radial-gradient(2px 2px at 63% 84%, #cfd6ff 50%, transparent 51%),
                radial-gradient(1px 1px at 8% 92%, #fff 50%, transparent 51%),
                radial-gradient(circle at 50% 30%, #0c0c22 0%, #02020a 70%);
        }
        body.no-3d .backdrop { display: block; }
        body.no-3d #gl { display: none; }

        .vignette {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, 0.55) 100%),
                repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 3px);
        }
        body.no-3d .vignette { display: none; }

        /* ---------- Back button (unchanged look) ---------- */
        .back-to-map {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 10px 15px;
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(255, 215, 0, 0.2);
        }
        .back-to-map:hover, .back-to-map:focus-visible {
            background: #ffd700;
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(255, 215, 0, 0.4);
            outline: none;
        }

        /* ---------- Story layout ---------- */
        #story {
            position: relative;
            z-index: 3;
            pointer-events: none;   /* clicks fall through to the 3D scene */
        }

        .pin {
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100svh;
            display: flex;
            align-items: center;
            padding: 0 6vw;
        }

        /* ---------- Hero ---------- */
        .hero { height: 100vh; height: 100svh; position: relative; }
        .hero .pin {
            position: absolute;
            inset: 0;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: clamp(2.6rem, 9vw, 5rem);
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 1s forwards 0.3s, titleFloat 3s ease-in-out infinite alternate;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #fff;
            font-family: arcade, cursive;
        }

        @keyframes titleFloat {
            0%   { transform: translateY(0);     text-shadow: 4px 4px 0px #667eea, 0 0 20px rgba(102, 126, 234, 0.5); }
            100% { transform: translateY(-15px); text-shadow: 4px 19px 0px rgba(102, 126, 234, 0.2), 0 0 40px rgba(255, 215, 0, 0.4); }
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0;
            animation: fadeInUp 1s forwards 0.6s;
            color: #ffd700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 3rem;
            left: 0; right: 0;
            margin: 0 auto;
            width: max-content;
            font-size: 1rem;
            opacity: 0;
            animation: fadeInBounce 1s forwards 1s, blink 1.5s infinite 2s;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            pointer-events: auto;
            background: none;
            border: 0;
            font-family: inherit;
        }
        .scroll-indicator::before { content: "[ "; }
        .scroll-indicator::after  { content: " ]"; }
        .scroll-indicator:focus-visible { outline: 1px solid #ffd700; outline-offset: 6px; }

        body.scrolled .hero h1,
        body.scrolled .hero p,
        body.scrolled .scroll-indicator { transition: opacity 0.6s; opacity: 0; animation: none; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInBounce { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* ---------- Chapters ---------- */
        .chapter { height: 120vh; position: relative; }
        .chapter[data-card="left"]  .pin { justify-content: flex-start; --dx: -1; }
        .chapter[data-card="right"] .pin { justify-content: flex-end;   --dx: 1;  }

        .card {
            --vis: 0;
            width: min(460px, 42vw);
            max-height: 88vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
            pointer-events: auto;
            background: rgba(6, 6, 20, 0.72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 1.8rem;
            border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
            box-shadow: 8px 8px 0px color-mix(in srgb, var(--accent) 22%, transparent);
            opacity: var(--vis);
            transform: translateX(calc((1 - var(--vis)) * var(--dx, 0) * 70px));
            will-change: opacity, transform;
        }
        .card.off { pointer-events: none; }
        body.no-3d .card.off { pointer-events: auto; }

        .card-year {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 0.4rem;
            text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 55%, transparent);
        }
        .card-title {
            font-size: 1.35rem;
            margin-bottom: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 1.25;
        }
        .card-desc {
            font-size: 0.9rem;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Photo shown here only when 3D is off or a texture couldn't load */
        .flat {
            display: none;
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            margin-top: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        body.no-3d .flat, .card.show-flat .flat { display: block; }

        .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
        .tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
        }

        .fun-fact {
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            background: color-mix(in srgb, var(--accent) 8%, transparent);
            font-size: 1.3rem;
            border-left: 4px solid var(--accent);
            line-height: 1.35;
        }
        .fun-fact strong { color: var(--accent); }

        /* ---------- Outro / contact ---------- */
        .outro { height: 100vh; height: 100svh; position: relative; }
        .outro .pin { justify-content: center; }
        .outro .card {
            --dx: 0;
            width: min(620px, 92vw);
            text-align: center;
            --accent: #ffd700;
        }
        .outro h2 { margin-bottom: 0.8rem; text-transform: uppercase; font-size: 1.6rem; }

        .contact-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem 2rem;
            margin-top: 1.4rem;
        }
        .contact-links a {
            color: #ffd700;
            text-decoration: none;
            font-size: 1rem;
            transition: transform 0.2s ease;
            display: inline-block;
            border-bottom: 1px solid transparent;
        }
        .contact-links a:hover, .contact-links a:focus-visible {
            transform: scale(1.1);
            border-bottom-color: #ffd700;
            outline: none;
        }

        .relics { margin-top: 1.8rem; padding-top: 1.2rem; border-top: 1px dashed rgba(255, 215, 0, 0.35); }
        .relics-title { font-size: 0.72rem; letter-spacing: 3px; color: rgba(255, 255, 255, 0.55); text-transform: uppercase; margin-bottom: 0.9rem; }
        .relic-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.7rem; }
        .relic-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #fff;
            font-family: inherit;
            font-size: 0.8rem;
            padding: 0.45rem 0.8rem 0.45rem 0.5rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }
        .relic-btn img { width: 26px; height: 26px; image-rendering: pixelated; }
        .relic-btn:hover, .relic-btn:focus-visible {
            background: rgba(255, 215, 0, 0.18);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 rgba(255, 215, 0, 0.3);
            outline: none;
        }

        /* ---------- HUD: progress rail + hint ---------- */
        .rail {
            position: fixed;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }
        .rail button {
            display: flex;
            align-items: center;
            gap: 10px;
            background: none;
            border: 0;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.55);
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 3px 0;
        }
        .rail .rail-year { opacity: 0; transform: translateX(6px); transition: opacity 0.2s, transform 0.2s; white-space: nowrap; }
        .rail .rail-dot {
            width: 10px; height: 10px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.5);
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
        }
        .rail button:hover .rail-year, .rail button:focus-visible .rail-year { opacity: 1; transform: none; }
        .rail .rail-year { background: rgba(0, 0, 0, 0.75); padding: 2px 6px; }
        .rail button.active { color: var(--accent); }
        .rail button.active .rail-dot {
            background: var(--accent);
            border-color: var(--accent);
            transform: rotate(45deg) scale(1.2);
            box-shadow: 0 0 12px var(--accent);
        }
        .rail button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

        .hint {
            position: fixed;
            right: 18px;
            bottom: 16px;
            z-index: 50;
            font-size: 11px;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.45);
            text-align: right;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .hint .touch-only { display: none; }
        @media (pointer: coarse) {
            .hint .kb-only { display: none; }
            .hint .touch-only { display: inline; }
        }
        body.no-3d .hint { display: none; }

        /* Hover label for floating relics */
        #tip {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            padding: 5px 9px;
            background: #ffd700;
            color: #000;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.5);
            transform: translate(14px, -34px);
            opacity: 0;
            transition: opacity 0.15s;
            white-space: nowrap;
        }
        #tip.show { opacity: 1; }

        /* ---------- Modal (unchanged look) ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
            padding: 16px;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal-content {
            background: #0a0a1a;
            border: 2px solid #ffd700;
            padding: 2rem;
            max-width: 500px;
            text-align: center;
            animation: scaleIn 0.3s ease;
            box-shadow: 10px 10px 0px rgba(255, 215, 0, 0.2);
        }
        @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-message { color: #fff; font-size: 1.1rem; margin-bottom: 2rem; line-height: 1.6; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

        .modal-button {
            padding: 0.8rem 2rem;
            border: 1px solid #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-family: inherit;
            text-transform: uppercase;
        }
        .modal-button.yes { background: #ffd700; color: #000; border-color: #ffd700; }
        .modal-button.yes:hover, .modal-button.yes:focus-visible { transform: translate(-2px, -2px); box-shadow: 4px 4px 0px rgba(255, 215, 0, 0.4); outline: none; }
        .modal-button.no { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, 0.5); }
        .modal-button.no:hover, .modal-button.no:focus-visible { background: rgba(255, 255, 255, 0.1); transform: translate(-2px, -2px); box-shadow: 4px 4px 0px rgba(255, 255, 255, 0.2); outline: none; }

        /* ---------- Toast (replaces the old alert()) ---------- */
        #toast {
            position: fixed;
            left: 50%;
            top: 70px;
            transform: translate(-50%, -20px);
            z-index: 3000;
            padding: 12px 18px;
            background: #ffd700;
            color: #000;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 0 28px rgba(255, 215, 0, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            max-width: calc(100vw - 32px);
            text-align: center;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        .sr-only {
            position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap;
        }

        /* ---------- Phones & portrait: card at the bottom, scene above ---------- */
        @media (max-width: 760px), (max-aspect-ratio: 19/20) {
            .pin { padding: 0 14px 16px; align-items: flex-end; justify-content: center !important; }
            .card {
                width: 100%;
                max-height: 54vh;
                padding: 1.1rem;
                transform: translateY(calc((1 - var(--vis)) * 40px));
            }
            .card-year { font-size: 1.5rem; }
            .card-title { font-size: 1.05rem; margin-bottom: 0.6rem; }
            .card-desc { font-size: 0.8rem; line-height: 1.55; }
            .tag { font-size: 0.65rem; padding: 0.2rem 0.55rem; }
            .fun-fact { font-size: 1.05rem; padding: 0.7rem 0.8rem; }
            .outro .pin { align-items: center; }
            .outro .card { padding: 1.3rem; }
            .rail { right: 6px; gap: 7px; }
            .rail .rail-year { display: none; }
            .rail .rail-dot { width: 8px; height: 8px; }
            .hint { display: none; }
            .back-to-map { top: 12px; left: 12px; font-size: 12px; padding: 8px 11px; }
        }

        /* ---------- No WebGL: a plain, readable timeline ---------- */
        body.no-3d .chapter { height: auto; padding: 1.5rem 0; }
        body.no-3d .chapter .pin { position: static; height: auto; padding: 0 6vw; }
        body.no-3d .card { --vis: 1 !important; opacity: 1; transform: none; max-height: none; overflow: visible; }
        body.no-3d .outro { height: auto; padding: 3rem 0 4rem; }
        body.no-3d .outro .pin { position: static; height: auto; }
        body.no-3d .hero { height: 70vh; }
        body.no-3d .rail { display: none; }
        body.no-3d #story { pointer-events: auto; }
        @media (max-width: 760px), (max-aspect-ratio: 19/20) {
            body.no-3d .chapter .pin { padding: 0 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero h1 { animation: fadeInUp 0.01s forwards; }
            .scroll-indicator { animation: fadeInBounce 0.01s forwards; }
            .card { transition: none; transform: none !important; }
        }
    </style>
</head>

        // Short names for the floating relics
        const relicLabels = {
            music: 'Playlist',
            webSystem: 'Web OS',
            github: 'GitHub',
            telegram: 'Telegram'
        };

        const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        };
        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const smooth01 = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

        // Shared with scene.js
        window.LIFE = { timeline: timelineData, artifacts: artifactsData, relicLabels, openArtifact: null, active: -1 };

        // ---------- Chapters ----------
        function renderTimeline() {
            const root = document.getElementById('chapters');
            timelineData.forEach((ev, i) => {
                const sec = el('section', 'chapter');
                sec.dataset.index = i;
                sec.dataset.card = i % 2 === 0 ? 'left' : 'right';
                sec.style.setProperty('--accent', ev.accent);

                const pin = el('div', 'pin');
                const card = el('article', 'card');
                card.appendChild(el('div', 'card-year', ev.year));
                card.appendChild(el('h2', 'card-title', ev.title));
                card.appendChild(el('p', 'card-desc', ev.description));

                const img = el('img', 'flat');
                img.alt = ev.title;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.src = ev.media;
                img.addEventListener('error', () => img.remove());
                card.appendChild(img);

                const tags = el('div', 'tags');
                ev.tags.forEach(t => tags.appendChild(el('span', 'tag', t)));
                card.appendChild(tags);

                if (ev.funFact) {
                    const ff = el('div', 'fun-fact font-merchant');
                    ff.appendChild(el('strong', '', ev.funFact));
                    card.appendChild(ff);
                }

                pin.appendChild(card);
                sec.appendChild(pin);
                root.appendChild(sec);
            });
        }

        // ---------- Rail ----------
        function renderRail() {
            const rail = document.getElementById('rail');
            timelineData.forEach((ev, i) => {
                const b = el('button');
                b.type = 'button';
                b.setAttribute('aria-label', `${ev.year}: ${ev.title}`);
                b.appendChild(el('span', 'rail-year', ev.year));
                b.appendChild(el('span', 'rail-dot'));
                b.addEventListener('click', () => {
                    const sec = document.querySelector(`.chapter[data-index="${i}"]`);
                    const r = sec.getBoundingClientRect();
                    const y = r.top + window.scrollY + r.height / 2 - window.innerHeight / 2;
                    window.scrollTo({ top: y, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
                });
                rail.appendChild(b);
            });
        }

        // ---------- Relic buttons in the outro (keyboard/touch access to the same modals) ----------
        function renderRelicButtons() {
            const row = document.getElementById('relic-row');
            Object.keys(artifactsData).forEach(key => {
                const d = artifactsData[key];
                const b = el('button', 'relic-btn');
                b.type = 'button';
                if (d.image) { const im = el('img'); im.src = d.image; im.alt = ''; b.appendChild(im); }
                b.appendChild(el('span', '', relicLabels[key] || key));
                b.addEventListener('click', () => openArtifactModal(key));
                row.appendChild(b);
            });
        }

        // ---------- Artifact modal ----------
        function openArtifactModal(artifactKey) {
            const data = artifactsData[artifactKey];
            if (document.querySelector('.modal-overlay')) return;
            const opener = document.activeElement;

            const overlay = el('div', 'modal-overlay');
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            const box = el('div', 'modal-content');

            if (data.image) {
                const im = el('img');
                im.src = data.image;
                im.alt = '';
                im.style.cssText = 'width:96px;height:96px;margin-bottom:1rem;image-rendering:pixelated;image-rendering:crisp-edges;';
                box.appendChild(im);
            }
            box.appendChild(el('div', 'modal-message', data.message));
            const buttons = el('div', 'modal-buttons');
            const yes = el('button', 'modal-button yes', data.yesText);
            const no = el('button', 'modal-button no', data.noText);
            buttons.append(yes, no);
            box.appendChild(buttons);
            overlay.appendChild(box);
            document.body.appendChild(overlay);

            const close = () => {
                overlay.remove();
                document.removeEventListener('keydown', onKey, true);
                if (opener && opener.focus) opener.focus({ preventScroll: true });
            };
            const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
            document.addEventListener('keydown', onKey, true);

            yes.addEventListener('click', () => { window.open(data.link, '_blank', 'noopener'); close(); });
            no.addEventListener('click', close);
            overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
            yes.focus();
        }
        window.LIFE.openArtifact = openArtifactModal;

        // ---------- Scroll-driven card visibility + rail ----------
        const chapterEls = [];
        let outroEl, railBtns = [];
        let ticking = false;

        function updateScroll() {
            ticking = false;
            const vh = window.innerHeight;
            let best = -1, bestDist = Infinity;

            chapterEls.forEach((sec, i) => {
                const r = sec.getBoundingClientRect();
                const c = r.top + r.height / 2 - vh / 2;            // px from viewport centre
                const d = Math.abs(c);
                const vis = 1 - smooth01(0.25 * vh, 0.55 * vh, d);
                const card = sec.querySelector('.card');
                card.style.setProperty('--vis', vis.toFixed(3));
                card.classList.toggle('off', vis < 0.05);
                if (d < bestDist) { bestDist = d; best = i; }
            });

            const orect = outroEl.getBoundingClientRect();
            const oc = orect.top + orect.height / 2 - vh / 2;
            const ovis = 1 - smooth01(0.25 * vh, 0.55 * vh, Math.abs(oc));
            const ocard = outroEl.querySelector('.card');
            ocard.style.setProperty('--vis', ovis.toFixed(3));
            ocard.classList.toggle('off', ovis < 0.05);

            let active = bestDist < 0.6 * vh ? best : -1;
            if (ovis > 0.5) active = timelineData.length;               // outro
            if (active !== window.LIFE.active) {
                window.LIFE.active = active;
                railBtns.forEach((b, i) => b.classList.toggle('active', i === active));
                const accent = active >= 0 && active < timelineData.length ? timelineData[active].accent : '#ffd700';
                document.documentElement.style.setProperty('--accent', accent);
                window.dispatchEvent(new CustomEvent('chapterchange', { detail: active }));
            }
            document.body.classList.toggle('scrolled', window.scrollY > 40);
        }
        function schedule() { if (!ticking) { ticking = true; requestAnimationFrame(updateScroll); } }

        renderTimeline();
        renderRail();
        renderRelicButtons();
        chapterEls.push(...document.querySelectorAll('.chapter'));
        outroEl = document.getElementById('outro');
        railBtns = [...document.querySelectorAll('#rail button')];
        window.addEventListener('scroll', schedule, { passive: true });
        window.addEventListener('resize', schedule);
        updateScroll();

        document.getElementById('start').addEventListener('click', () => {
            const first = chapterEls[0].getBoundingClientRect();
            window.scrollTo({ top: first.top + window.scrollY + first.height / 2 - window.innerHeight / 2,
                              behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
        });

        // ---------- Easter egg: Konami code ----------
        let konamiCode = [];
        const konamiPattern = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
        const toastEl = document.getElementById('toast');
        let toastTimer = 0;
        document.addEventListener('keydown', (e) => {
            konamiCode.push(e.key);
            konamiCode = konamiCode.slice(-10);
            if (konamiCode.join(',') === konamiPattern.join(',')) {
                toastEl.textContent = '🎉 You found the secret! You are awesome!';
                toastEl.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4200);
                window.dispatchEvent(new CustomEvent('konami'));
            }
        });
    </script>

    <!-- The 3D flight. If this fails (no WebGL, blocked module), the page falls back to a plain timeline. -->
    <script type="module" src="scene.js" onerror="document.body.classList.add('no-3d')"></script>
