<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat - Mina Eskandar</title>
    <link rel="stylesheet" href="../fonts.css">
    <link rel="stylesheet" href="../theme.css">
    <script src="https://iframe.chat/scripts/main.min.js"></script>
    <script>
        chattable.initialize({
            stylesheet: "chattable.css",
        });
    </script>
    <style>
        :root {
            --chat-bg: rgba(15, 15, 30, 0.95);
        }

        body {
            background: #000;
            color: var(--text);
            font-family: Pixel, Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .back-to-map {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 15px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 0px rgba(122, 106, 238, 0.2);
        }

        .back-to-map:hover {
            background: var(--accent);
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(122, 106, 238, 0.4);
        }

        #chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: var(--chat-bg);
            border: 2px solid var(--border-hi);
            box-shadow: 12px 12px 0px rgba(122, 106, 238, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(122, 106, 238, 0.1);
        }

        .chat-title {
            font-family: arcade, cursive;
            font-size: 1.2rem;
            color: var(--text-hi);
            letter-spacing: 2px;
        }

        .chat-status {
            font-size: 0.8rem;
            color: #00ff00;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }

        .chat-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text-mid);
        }

        .chat-footer {
            padding: 15px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #0a0a1a 0%, #000 100%);
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 0;
        }
        #chattable {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading State Styles */
        #chat-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
        }

        .loading-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
            opacity: 0.6;
        }

        .loading-text {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 15px;
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(122, 106, 238, 0.1);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .loading-progress {
            width: 40%;
            height: 100%;
            background: var(--accent);
            animation: progress 2s infinite linear;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        /* Fix pulse for icons/placeholder.svg which isn't centered by default in the div */
        #chat-loader .loading-icon {
            transform: none;
            animation: pulse-simple 2s infinite ease-in-out;
        }

        @keyframes pulse-simple {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>
    <a href="../index.html" class="back-to-map">&lt; RETURN TO MAP</a>

    <div id="chat-container">
        <div class="chat-header">
            <div class="chat-title">COMM_LINK_v1.0</div>
            <div class="chat-status" id="conn-status">● CONNECTING</div>
        </div>
        
        <div class="chat-placeholder">
            <div id="chat-loader">
                <img src="../icons/placeholder.svg" alt="Loading" class="loading-icon">
                <div class="loading-text">SYNCING SIGNAL...</div>
                <div class="loading-bar"><div class="loading-progress"></div></div>
            </div>
            <iframe src="https://iframe.chat/embed?chat=10147650" id="chattable" style="opacity: 0; transition: opacity 0.5s;"></iframe>
        </div>

        <div class="chat-footer">
            SECURE CHANNEL // ENCRYPTION: AES-256-GCM
        </div>
    </div>

    <script>
        function createStars() {
            const starfield = document.getElementById('starfield');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = 0.2 + Math.random() * 0.8;
                starfield.appendChild(star);
            }
        }
        createStars();

        // Handle iframe loading
        const iframe = document.getElementById('chattable');
        const loader = document.getElementById('chat-loader');
        const status = document.getElementById('conn-status');

        iframe.onload = function() {
            loader.style.display = 'none';
            iframe.style.opacity = '1';
            status.textContent = '● ONLINE';
            status.style.color = '#00ff00';
            status.style.animation = 'none';
        };
    </script>
</body>
</html>
